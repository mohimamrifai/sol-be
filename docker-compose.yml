services:
  mysql:
    image: mysql:8
    container_name: laravel_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sol_logistics

    volumes:
      - mysql_data:/var/lib/mysql

    # Host access for `php artisan` on laptop (not inside Docker)
    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel_backend

    volumes:
      - .:/var/www

    working_dir: /var/www

    ports:
      - "8000:8000"

    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      PHP_CLI_SERVER_WORKERS: "1"

    depends_on:
      mysql:
        condition: service_healthy

    command: ["/bin/sh", "/var/www/docker/php/entrypoint.sh"]

volumes:
  mysql_data:
