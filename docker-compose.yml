version: "3.9"

services:
  mysql:
    image: mysql:8
    container_name: laravel_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sol_logistics

    # Port mapping dihapus agar tidak konflik dengan MySQL host lokal.
    # Database diakses dari service `backend` lewat network internal Docker.

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
      build:
        context: .
        dockerfile: docker/php/Dockerfile

      container_name: laravel_backend

      volumes:
        - .:/var/www

      working_dir: /var/www

      ports:
        - "8000:8000"

      depends_on:
        - mysql

      command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  mysql_data: